# ─────────────────────────────────────────────────────────────
# 显式排除（D-10 第 1、2 条裁定）：以下端点**刻意不登记权限码**。
#
# 排除不是「忘记登记」—— 排除项必须写明管辖机制与理由，
# 并由守卫 G8/G9/G10 机械校验（少写理由、越权登记都会红）。
#
#   governed_by: role-guard —— 授权由代码内的 roleGuard 负责（代理端）。
#        ⚠️ **刻意不翻译成权限码**：两套授权并存会产生「两边都松」的缝隙
#        （roleGuard 放行 + 清单无码 ⇒ 实际无人管；反之要维护两处）。
#   governed_by: self-service —— 自助行为，任何登录用户都应可执行
#        （登录 / 刷新 / 切账套）。加动作码会导致「无法登录 / 无法切账套」。
