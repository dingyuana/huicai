# SPEC-P133 —— 端点权限唯一事实源
#
# 🔴 本文件是「端点需要哪个权限」的**唯一**事实源。
#    后端 PermissionEnforcementInterceptor 与守卫 G1/G2/G3 都从这里读，
#    **前端路由 meta.permission 也必须来自这里**（G3 校验）—— 不得各写一份。
#
# ⚠️ 批次 1 状态：**清单尚未补齐**，仅登记已受 @PreAuthorize 保护的端点。
#    此刻后端行为 = 拦截器 warn-only（D-1 裁定），**不得对外宣称已完成权限管控**。
#    写端点缺口以 G2 棘轮记录，只许减不许增。
#
# 字段说明：
#   method     —— HTTP 方法
#   path       —— 完整路径（含类级 @RequestMapping 前缀）
#   permission —— 所需权限码，必须存在于 t_menu.permission（G1 校验）
#   write      —— 是否写端点；true 的必须全部登记（G2 校验）

version: 1
endpoints:
  - method: POST
    path: /api/base/voucher/v1/period-close/reopen
    permission: period:reopen
    write: true

  - method: POST
    path: /api/base/voucher/v1/period-close/year-close
    permission: period:year-close
    write: true

  - method: DELETE
    path: /api/v1/customers/{id}
    permission: party:list
    write: true

  - method: DELETE
    path: /api/v1/employees/{id}
    permission: party:list
    write: true

  - method: DELETE
    path: /api/v1/subjects/{id}
    permission: subjects:manage
    write: true

  - method: POST
    path: /api/v1/system/clear-all
    permission: system:clear
    write: true

  - method: POST
    path: /api/v1/system/clear-bank-statements
    permission: system:clear
    write: true

  - method: POST
    path: /api/v1/system/clear-business-docs
    permission: system:clear
    write: true

  - method: POST
    path: /api/v1/system/clear-invoice-records
    permission: system:clear
    write: true

  - method: POST
    path: /api/v1/system/clear-payables
    permission: system:clear
    write: true

  - method: POST
    path: /api/v1/system/clear-receivables
    permission: system:clear
    write: true

  - method: POST
    path: /api/v1/system/clear-report-data
    permission: system:clear
    write: true

  - method: POST
    path: /api/v1/system/clear-settlements
    permission: system:clear
    write: true

  - method: POST
    path: /api/v1/system/clear-vouchers
    permission: system:clear
    write: true

  - method: DELETE
    path: /api/v1/system/dept/{id}
    permission: system:dept:list
    write: true

  - method: DELETE
    path: /api/v1/system/menu/{id}
    permission: system:menu:list
    write: true

  - method: DELETE
    path: /api/v1/system/role/{id}
    permission: system:role:list
    write: true

  - method: DELETE
    path: /api/v1/system/user/{id}
    permission: system:user:list
    write: true

  - method: DELETE
    path: /api/v1/vendors/{id}
    permission: party:list
    write: true
