# SPEC-P133 —— 端点权限唯一事实源
#
# 🔴 本文件是「端点需要哪个权限」的**唯一**事实源。
#    后端 PermissionEnforcementInterceptor 与守卫 G1/G2/G3 都从这里读，
#    **前端路由 meta.permission 也必须来自这里**（G3 校验）—— 不得各写一份。
#
# ⚠️ 批次 1 状态：**清单尚未补齐**，仅登记已受 @PreAuthorize 保护的端点。
#    当前已登记 52 条（批次 1 = 19，批次 3 模块 1 = 系统管理 29，批次 3 模块 2 = 期末结账族 4）。
#    写端点缺口以 G2 棘轮记录，只许减不许增。
#
# 字段说明：
#   method     —— HTTP 方法
#   path       —— 完整路径（含类级 @RequestMapping 前缀）
#   permission —— 所需权限码，必须存在于 t_menu.permission（G1 校验）
#   write      —— 是否写端点；true 的必须全部登记（G2 校验）
#   coarse     —— true 表示该权限码是**页面级**（:list / :view / :workbench），
#                 语义是「能进该页 = 能做该页操作」，**不是动作级授权**。
#                 ⚠️ coarse 条目在 warn-only 下无害，但**切 fail-closed 时它们
#                 只会形成粗粒度屏障**，不等于「每个动作都有人管」。
#                 G6 对 coarse 数量做棘轮，只许减不许增。

version: 1

# 🔴 执行模式（D-1 裁定；批次 4 才切 enforcing）
#   warn-only : 清单命中但缺权限 ⇒ **只告警、仍放行**。
#               批次 3 逐步登记端点时用它，保证「登记」本身**不改变任何现有行为** ——
#               否则一旦把 288 个写端点登记进去，拦截器立刻开始 403，
#               等于**跳过批次 4 就 fail-closed**，与 D-1 裁定直接冲突。
#   enforcing : 清单命中但缺权限 ⇒ 403。批次 4（G2 缺口归零）才切。
enforcement: warn-only

