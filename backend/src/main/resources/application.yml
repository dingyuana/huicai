server:
  port: 8080

spring:
  application:
    name: huicai-backend

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  datasource:
    url: jdbc:postgresql://localhost:5432/huicai
    username: huicai
    password: huicai123
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    table: flyway_schema_history

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  rabbitmq:
    host: localhost
    port: 5672
    username: huicai
    password: huicai123
    virtual-host: /

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.huicai.**.entity
  global-config:
    banner: false
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

# JWT 配置
jwt:
  secret: huicai-finance-jwt-secret-key-2026-very-long-secret-string
  access-token-expiration: 86400000
  refresh-token-expiration: 604800000

# 代码审核定时任务配置
huicai:
  code-audit:
    # cron 表达式: 秒 分 时 日 月 周(?)  默认为每天 09:00
    cron: 0 0 9 * * ?
    # 项目根目录 (默认自动探测 .git 目录)
    project-root: ${user.dir}