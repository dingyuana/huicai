server:
  port: 8000

spring:
  application:
    name: huicai-backend

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  datasource:
    url: jdbc:postgresql://localhost:5432/huicai
    username: huicai
    password: ${DB_PASSWORD:huicai123}
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    table: flyway_schema_history
    out-of-order: true
    validate-on-migrate: false

  jackson:
    date-format: yyyy-MM-dd HH:mm
    time-zone: GMT+8

  main:
    allow-circular-references: true

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

  rabbitmq:
    host: localhost
    port: 5672
    username: huicai
    password: ${RABBITMQ_PASSWORD:huicai123}
    virtual-host: /

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.huicai.**.entity
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

# JWT 配置
# secret 必须由环境变量 JWT_SECRET 注入，**无默认值**：
# 可预测的默认密钥等于无密钥（任何人可据此伪造任意用户 token）。
# 缺变量时应用启动即失败（fail-fast），由 JwtProvider 的 @Value 解析触发。
# 本地开发：export JWT_SECRET=$(openssl rand -base64 48)
# 长度要求 ≥32 字节（HMAC-SHA256），否则 Keys.hmacShaKeyFor 抛 WeakKeyException。
# 测试环境：src/test/resources/application.yml 自带独立测试密钥，不依赖此处。
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 86400000
  refresh-token-expiration: 604800000

# MinIO 配置
minio:
  endpoint: http://localhost:9000
  access-key: huicai
  secret-key: ${MINIO_ROOT_PASSWORD:huicai123}
  bucket: huicai-files

# AI 服务配置
ai:
  # AI 服务地址：宿主端口 8001（docker-compose 映射 8001:8000，容器内仍 8000）
  # 不可写成 8000 —— 那是后端自身端口，会形成自引用
  service-url: ${AI_SERVICE_URL:http://localhost:8001}
  enabled: true
  ocr-enabled: false
  embedding-enabled: false
  # NVIDIA API 配置 (minimaxai/minimax-m3 多模态模型)
  # 密钥一律从环境变量注入，禁止硬编码（AGENTS §7-3）。
  # 本地用法：export NVIDIA_API_KEY=nvapi-xxxx
  # 留空时 nvidia.enabled 虽为 true，但任何调用都会因缺密钥而失败，属预期。
  nvidia:
    enabled: true
    api-key: ${NVIDIA_API_KEY:}
    base-url: ${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
    model: minimaxai/minimax-m3
    max-tokens: 8192
    temperature: 1.00
    top-p: 0.95
    connect-timeout: 30
    read-timeout: 120
  # AMD Radeon AI 配置 (OpenAI 兼容, 主模型 MiMo-V2.6-Flash 价格档最低且支持视觉)
  # 列表内无 free:true 模型; api-key 只从环境变量 AMD_RADEON_API_KEY 注入，不给默认值（AGENTS §7-3）
  amd:
    enabled: true
    api-key: ${AMD_RADEON_API_KEY:}
    base-url: https://developer.amd.com.cn/radeon/api/v1
    model: MiMo-V2.6-Flash
    max-tokens: 8192
    temperature: 1.00
    top-p: 0.95
    connect-timeout: 30
    read-timeout: 120

# P31: 发票导入后自动执行全流程 (审核发票→审核业务单→生凭证)
# 默认 false (不影响现有流程), 开启后导入完成立即异步处理
# 人仍是凭证审核的最终负责人 (凭证状态 PENDING_REVIEW 等待人工终审)
invoice:
  auto-flow-after-import: false