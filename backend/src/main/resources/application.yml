server:
  port: 8000

spring:
  application:
    name: huicai-backend

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  datasource:
    url: jdbc:postgresql://localhost:5432/huicai
    username: huicai
    password: huicai123
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    table: flyway_schema_history

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  rabbitmq:
    host: localhost
    port: 5672
    username: huicai
    password: huicai123
    virtual-host: /

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.huicai.**.entity
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

# JWT 配置
jwt:
  secret: huicai-finance-jwt-secret-key-2026-very-long-secret-string
  access-token-expiration: 86400000
  refresh-token-expiration: 604800000

# MinIO 配置
minio:
  endpoint: http://localhost:9000
  access-key: huicai
  secret-key: huicai123
  bucket: huicai-files

# AI 服务配置
ai:
  service-url: http://localhost:8000
  enabled: true
  ocr-enabled: false
  embedding-enabled: false
  # NVIDIA API 配置 (minimaxai/minimax-m3 多模态模型)
  nvidia:
    enabled: true
    api-key: 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
    base-url: https://integrate.api.nvidia.com/v1
    model: minimaxai/minimax-m3
    max-tokens: 8192
    temperature: 1.00
    top-p: 0.95
    connect-timeout: 30
    read-timeout: 120

# P31: 发票导入后自动执行全流程 (审核发票→审核业务单→生凭证)
# 默认 false (不影响现有流程), 开启后导入完成立即异步处理
# 人仍是凭证审核的最终负责人 (凭证状态 PENDING_REVIEW 等待人工终审)
invoice:
  auto-flow-after-import: false