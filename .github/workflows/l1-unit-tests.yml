name: L1 Unit Tests (CI Gate)

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  # ==================== Java Unit Tests (Backend) ====================
  java-unit-tests:
    name: Java Unit Tests + Branch Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 🔥 修改1：JDK 从 17 升级为 21，与 pom.xml 的 release 21 保持一致
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Tests with JaCoCo
        run: |
          cd backend
          mvn clean test jacoco:report
        env:
          # 🔥 修改2：修正 -X2g 拼写错误为 -Xmx2g
          MAVEN_OPTS: "-XX:+UseCompressedOops -Xmx2g"

      # 覆盖率门禁（INSTRUCTION/BRANCH/METHOD 各 70%）已绑定在 pom.xml 的
      # jacoco-check execution（phase=test），随上面的 mvn test 一起执行。
      # 不要再单独跑 mvn jacoco:check —— 命令行调用走 default-cli execution，
      # 拿不到 pom 里的 <rules>，必然报
      # "The parameters 'rules' for goal ...:check are missing or invalid" 而假失败。

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-java
          path: backend/target/site/jacoco/
          retention-days: 30

  # ==================== Frontend Component Tests ====================
  frontend-unit-tests:
    name: Frontend Unit Tests + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # 🔥 修改3：明确指定依赖锁文件在 frontend 子目录下
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: cd frontend && npm ci --prefer-offline

      - name: Run Vitest with Coverage
        run: |
          cd frontend
          npm test -- --coverage
        env:
          CI: true

      - name: Upload Frontend Coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 30