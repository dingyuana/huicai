name: L1 Unit Tests (CI Gate)

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  # ==================== Java Unit Tests (Backend) ====================
  java-unit-tests:
    name: Java Unit Tests + Branch Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Tests with JaCoCo
        run: |
          cd backend
          mvn clean test jacoco:report
        env:
          MAVEN_OPTS: "-XX:+UseCompressedOops -X2g"

      # === 分支覆盖率检查（利用 pom.xml 中配置的 jacoco:check 门槛） ===
      - name: Check Branch Coverage (≥70%)
        run: |
          cd backend
          mvn jacoco:check
        env:
          MAVEN_OPTS: "-XX:+UseCompressedOops -X2g"

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-java
          path: backend/target/site/jacoco/
          retention-days: 30

  # ==================== Frontend Component Tests ====================
  frontend-unit-tests:
    name: Frontend Unit Tests + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: cd frontend && npm ci --prefer-offline

      - name: Run Vitest with Coverage
        run: |
          cd frontend
          npm test -- --coverage
        env:
          CI: true

      - name: Upload Frontend Coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 30
