name: Performance Regression Check

on:
  schedule:
    - cron: "0 22 * * 6"  # 每周六晚上（北京时间周日凌晨6点）
  workflow_dispatch:
    inputs:
      scenario:
        description: "测试场景"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - voucher
          - settlement
          - tax

# 🔥 修改1：增加最小权限控制
permissions:
  contents: read

jobs:
  perf-baseline:
    name: 性能基线采集 (k6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 🔥 修改2：使用官方 Action 安装 k6，替代已废弃的 apt-key 方式
      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 performance tests against staging
        working-directory: backend/scripts
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.STAGING_URL }}" ]; then
            echo "::error::STAGING_URL secret not configured. Set it in repo Settings > Secrets and variables > Actions"
            exit 1
          fi

          # Determine scenario
          SCENARIO="${{ github.event.inputs.scenario || 'all' }}"
          TEST_FILE="perf-${SCENARIO}.js"

          if [ ! -f "$TEST_FILE" ]; then
            echo "::warning::Test file $TEST_FILE not found, using default voucher scenario"
            TEST_FILE="perf-voucher.js"
          fi

          if [ ! -f "$TEST_FILE" ]; then
            echo "::error::No k6 test file found in backend/scripts/"
            exit 1
          fi

          echo "Running k6 scenario: $SCENARIO"
          k6 run --summary-export metrics.json "$TEST_FILE"
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
          API_TOKEN: ${{ secrets.STAGING_API_TOKEN }}

      # 🔥 修改3：使用 jq 健壮地解析 k6 指标，替换原来脆弱的 Python 解析逻辑
      - name: Validate performance thresholds
        working-directory: backend/scripts
        run: |
          set -euo pipefail
          if [ ! -f metrics.json ]; then
            echo "::error::metrics.json not generated"
            exit 1
          fi

          THRESHOLD_MS=3000
          FAILED=0

          # 使用 jq 提取所有包含 p(95) 的指标键值对
          # k6 导出的格式为: { "metrics": { "http_req_duration": { "values": { "p(95)": 123.45 } } } }
          METRICS=$(jq -r '.metrics | to_entries[] | select(.value.values."p(95)" != null) | "\(.key):\(.value.values."p(95)")"' metrics.json)

          if [ -z "$METRICS" ]; then
            echo "::warning::No p(95) metrics found in metrics.json"
          fi

          while IFS=: read -r key value; do
            int_val=$(echo "$value" | grep -oE '[0-9]+' | head -1)
            if [ -n "$int_val" ] && [ "$int_val" -gt "$THRESHOLD_MS" ]; then
              echo "::warning file=metrics.json::$key = ${int_val}ms exceeds threshold ${THRESHOLD_MS}ms"
              FAILED=1
            fi
          done <<< "$METRICS"

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more endpoints exceed performance threshold"
            exit 1
          fi
          echo "All performance checks passed"

      - name: Upload k6 metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-metrics
          path: backend/scripts/metrics.json
          retention-days: 90