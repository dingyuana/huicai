name: Full Stack Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  backend-test:
    name: 后端测试 + 覆盖率检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 运行 Maven 测试 + JaCoCo 覆盖率检查
        run: cd backend && mvn test

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  api-coverage-check:
    name: 接口覆盖检测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 2026-10-03：由「恒绿」改为「棘轮」。
      # 此前本 job 带 continue-on-error: true，等于恒绿（真出事也没人看）；但直接
      # 去掉又会恒红 —— 基线是「后端 280 个端点前端未接」，280 条存量会让人习惯性
      # 忽略门禁（AGENTS §4.5 第 21 条：恒绿与恒红同样有害）。
      # 故改为与 JaCoCo 同款的棘轮：上限写死为实测值，只在**倒退**时红。
      # ⚠️ 每修掉一批端点接入，必须回来下调 --max-uncovered（否则棘轮变固定上限）。
      - name: 运行接口覆盖检测（棘轮模式）
        run: python scripts/check_api_coverage.py --max-uncovered 280 --max-orphan 0 

  entity-status-massassignment-check:
    name: 实体入参状态越权检测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行实体入参状态越权检测
        run: python scripts/check_entity_status_massassignment.py
        # 🔥 同上：默认报告模式。存量清理完毕后改为 --strict 阻断。

  registry-drift-check:
    name: 登记册漂移守卫（阻断式）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 登记册结构/状态码/SPEC 引用守卫
        run: python scripts/check_registry_drift.py

  tenant-fixture-check:
    name: 租户夹具一致性检测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # P102-M2 把 enterpriseId 改为无条件覆盖后，「只给实体设 enterpriseId 而不切
      # 上下文」的夹具会被静默改写，且报错伪装成「唯一键冲突 / 隔离失效」（DIR-001）。
      # 本检测已反证可红：删掉某测试类的 useEnterprise(...) 后 exit=1，
      # 真实仓库 exit=0。故不加 continue-on-error —— 存量已清零，门禁必须能变红。
      - name: 运行租户夹具一致性检测
        run: python scripts/check_tenant_fixture.py

  route-coverage-check:
    name: 路由覆盖检测
    runs-on: ubuntu-latest
    # 2026-10-03：删除 needs: api-coverage-check。
    # 原依赖毫无意义 —— 被依赖的 job 带 continue-on-error 恒不阻断，
    # 于是「A 完成后跑 B」退化成纯粹的时间串行；两者本无因果关系。
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行路由覆盖检测
        run: python scripts/check_route_coverage.py

  build-check:
    name: 构建验证
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          # 🔥 修改2：将 17 改为 21，与 backend-test 及 pom.xml (release 21) 保持一致
          java-version: '21' 
          distribution: 'temurin'
          cache: maven

      - name: 后端构建验证
        run: cd backend && mvn package -DskipTests