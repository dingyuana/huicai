name: SPEC Contract Validation

on:
  push:
    branches: [ main, develop ]
    paths:
      # 🔥 修改1：使用 ** 以匹配 docs/specs 下所有子目录中的 .md 文件
      - 'docs/specs/**/*.md'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'docs/specs/**/*.md'

# 🔥 修改2：遵循最小权限原则
permissions:
  contents: read

jobs:
  validate-spec-contracts:
    name: 校验 SPEC 契约文件
    runs-on: ubuntu-latest
    timeout-minutes: 10   # 🔥 修改3：增加超时限制，避免卡死
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'   # 🔥 修改4：启用 pip 缓存，加速后续构建

      - name: 安装 PyYAML
        # 🔥 修改5：固定版本，避免上游不兼容更新导致 CI 突然失败
        run: pip install pyyaml==6.0.2

      - name: 检查校验脚本是否存在
        # 🔥 修改6：提前检查脚本文件，给出明确错误提示
        run: |
          if [ ! -f scripts/validate_spec_contract.py ]; then
            echo "::error::scripts/validate_spec_contract.py 文件不存在，请确认仓库结构"
            exit 1
          fi

      - name: 校验所有 SPEC 契约
        run: |
          # 🆕 棘轮（AGENTS §4.5 第 21/25 条）：上限写在命令行里（可审计）。
          # 不加此参数时 94/104 缺契约仍是 PASSED ⇒ 门禁恒绿、无信号。
          # 上限 94 = 2026-10-08 实测值（total=104 validated=10 broken=0；已补 P112/P113 契约，96→94）。
          # 每补齐一份契约就把上限下调 1 ⇒ 棘轮而非固定阈值。
          python scripts/validate_spec_contract.py \
            --dir docs/specs/ \
            --check-implementation \
            --check-tests \
            --max-no-contract 94 \
            --project-root "${{ github.workspace }}"