name: L2 Integration Tests (Testcontainers)

# P104-a（REQ-2026-131）修复要点：
#  ① 真库套件此前只监听 develop，主干 PR 完全不跑真库 —— 历史上 136 项慢测缺陷
#     全部由真库测出，只跑 Mock 的门禁等于没有门禁。故把 main 纳入监听。
#  ② 预拉镜像此前是 mysql:8.0.36 / redis:7.2.4，而测试实际用
#     pgvector/pgvector:pg16（AbstractMapperTest:71）—— 拉的是用不上的镜像。
#  ③ 覆盖率门禁（INSTRUCTION/BRANCH/METHOD 各 70%）已绑定在 pom.xml 的
#     test 阶段（jacoco-check execution），随本步骤的 mvn test 一起执行，
#     无需再单独跑一次 mvn jacoco:check（重复执行反而多花 2 分钟且易误报）。
on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
  workflow_dispatch:

# 同一分支的新推送取消上一次未完成的运行，避免真库套件排队浪费配额
concurrency:
  group: l2-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    name: Integration Tests (DB/Redis, 含 slow 组)
    runs-on: ubuntu-latest
    # 真库套件需拉起 Testcontainers(PostgreSQL) 并串行执行约 250 个真库测试类，
    # 20 分钟不足（历史慢测缺陷修复后的全量实测量级为 1998 用例）
    timeout-minutes: 45
    # Redis 服务：VoucherNoServiceImpl.generateNextNo:38 用 RedisTemplate.hasKey()
    # 生成连续凭证号，VoucherIntegrationTest / LedgerChainRealDBTest /
    # BankStatementAuditIntegrationTest 均经该路径。CI 上没有 Redis 时这 11 个用例
    # 全部报 RedisConnectionFailure（localhost:6379 Connection refused）。
    # PostgreSQL 不走 services —— 它由 Testcontainers 动态端口注入（见 pre-pull）。
    services:
      redis:
        image: redis:7.2.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # JDK 21 与 pom.xml 的 <release> 21 保持一致
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 预拉测试实际使用的镜像，避免 CI 网络抖动导致 Testcontainers 启动失败。
      # 镜像必须与 AbstractMapperTest:71 的 pgvector/pgvector:pg16 一致，
      # 且不用 latest（pinned 保证可复现）。
      - name: Pre-pull Testcontainers Images
        run: docker pull pgvector/pgvector:pg16

      # 关键：-DexcludedGroups="" 覆盖 pom.xml 默认的 <excludedGroups>slow</excludedGroups>，
      # 让 @SlowTest（需 Docker 的真库测试）真正参与执行。
      # 用 mvn test 而非 mvn verify：本项目集成测试全部是 surefire @Test，
      # failsafe 从不产出报告，verify 只会白跑一次 package。
      - name: Run Integration Tests (含 slow 组, 覆盖率门禁同批生效)
        run: mvn test -DexcludedGroups="" -DfailIfNoTests=false
        working-directory: backend
        env:
          MAVEN_OPTS: "-XX:+UseCompressedOops -Xmx2g"
          # 加快 CI 上的资源清理
          TESTCONTAINERS_RYUK_DISABLED: true

      - name: Upload Integration Test Results
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: |
            backend/target/surefire-reports/*.xml
            backend/target/site/jacoco/
          retention-days: 30
