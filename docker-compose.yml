version: "3.8"

networks:
  huicai-net:
    driver: bridge

volumes:
  pgdata:
  minio-data:

services:
  postgres16:
    image: pgvector/pgvector:pg16
    container_name: huicai-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: huicai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-huicai123}
      POSTGRES_DB: huicai
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    networks:
      - huicai-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huicai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis7:
    image: redis:7-alpine
    container_name: huicai-redis
    ports:
      - "6379:6379"
    networks:
      - huicai-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    container_name: huicai-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: huicai
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-huicai123}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - huicai-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  rabbitmq3:
    image: rabbitmq:3-management
    container_name: huicai-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: huicai
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-huicai123}
    networks:
      - huicai-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: huicai-ai-service
    ports:
      # 宿主端口 8001：8000 已被 backend 占用（server.port=8000），同映射会导致全量 up 失败
      # 容器内端口仍为 8000（Dockerfile EXPOSE / uvicorn --port 8000 不变）
      - "8001:8000"
    environment:
      HUICAI_RABBITMQ_URL: amqp://${RABBITMQ_USER:-huicai}:${RABBITMQ_PASSWORD:-huicai123}@host.docker.internal:5672/
      HUICAI_DB_HOST: postgres16
      HUICAI_DB_PORT: 5432
      HUICAI_DB_USER: huicai
      HUICAI_DB_PASSWORD: ${POSTGRES_PASSWORD:-huicai123}
      HUICAI_DB_NAME: huicai
      HUICAI_MINIO_ENDPOINT: http://minio:9000
      HUICAI_MINIO_ACCESS_KEY: huicai
      HUICAI_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-huicai123}
      HUICAI_OCR_ENGINE: tesseract
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres16:
        condition: service_healthy
    networks:
      - huicai-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: huicai-backend
    ports:
      - "8000:8000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres16:5432/huicai
      # 非超级应用角色（P101-M5b/V2）：超级用户会绕过 RLS，故应用不得用 huicai。
      # 角色由 M5b 手册 §V2 创建并接管对象属主；口令与 postgres 容器口令分开注入。
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-huicai_app}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-huicai123}
      # 🔴 Flyway 用独立身份（2026-10-09 修）：应用是 NOSUPERUSER + NOBYPASSRLS，
      #   RLS 生效后 seed 迁移必被 with_check 拒（t_cash_flow_rule 等），应用起不来。
      #   M5b 手册既定设计就是「huicai 超级用户保留给运维/迁移」，故此处指向它。
      #   ⚠️ 这是**部署正确性**要求，不是图省事：漏配则 seed 迁移全红。
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres16:5432/huicai
      SPRING_FLYWAY_USER: ${FLYWAY_USER:-${POSTGRES_USER:-huicai}}
      SPRING_FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:-${POSTGRES_PASSWORD:-huicai123}}
      SPRING_RABBITMQ_HOST: host.docker.internal
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: huicai
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-huicai123}
      SPRING_DATA_REDIS_HOST: redis7
      SPRING_DATA_REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: huicai
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-huicai123}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env - see .env.example}
      # 敏感凭据从宿主环境注入，勿写入本文件（AGENTS §7-3）
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # ⚠️ DESKTOP-GB3K98M 是 Windows 主机名，Docker 默认把它设为容器 hostname；
      #   MyBatis-Plus 3.5.7 的 NetUtils.findFirstNonLoopbackAddress() 调
      #   InetAddress.getLocalHost() 解析此 hostname 失败 ⇒ 抛出
      #   RuntimeException: Unable to retrieve localhost，整个应用启动不起来。
      #   此处显式把它映射到 127.0.0.1，让 Java 能拿到回环地址而非抛异常。
      - "DESKTOP-GB3K98M:127.0.0.1"
    depends_on:
      postgres16:
        condition: service_healthy
      redis7:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - huicai-net
    restart: unless-stopped