version: "3.8"

networks:
  huicai-net:
    driver: bridge

volumes:
  pgdata:
  minio-data:

services:
  postgres16:
    image: pgvector/pgvector:pg16
    container_name: huicai-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: huicai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-huicai123}
      POSTGRES_DB: huicai
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    networks:
      - huicai-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huicai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis7:
    image: redis:7-alpine
    container_name: huicai-redis
    ports:
      - "6379:6379"
    networks:
      - huicai-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    container_name: huicai-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: huicai
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-huicai123}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - huicai-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  rabbitmq3:
    image: rabbitmq:3-management
    container_name: huicai-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: huicai
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-huicai123}
    networks:
      - huicai-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: huicai-ai-service
    ports:
      # 宿主端口 8001：8000 已被 backend 占用（server.port=8000），同映射会导致全量 up 失败
      # 容器内端口仍为 8000（Dockerfile EXPOSE / uvicorn --port 8000 不变）
      - "8001:8000"
    environment:
      HUICAI_RABBITMQ_URL: amqp://${RABBITMQ_USER:-huicai}:${RABBITMQ_PASSWORD:-huicai123}@host.docker.internal:5672/
      HUICAI_DB_HOST: postgres16
      HUICAI_DB_PORT: 5432
      HUICAI_DB_USER: huicai
      HUICAI_DB_PASSWORD: ${POSTGRES_PASSWORD:-huicai123}
      HUICAI_DB_NAME: huicai
      HUICAI_MINIO_ENDPOINT: http://minio:9000
      HUICAI_MINIO_ACCESS_KEY: huicai
      HUICAI_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-huicai123}
      HUICAI_OCR_ENGINE: tesseract
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres16:
        condition: service_healthy
    networks:
      - huicai-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: huicai-backend
    ports:
      - "8000:8000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres16:5432/huicai
      # 当前仍用 bootstrap 超级用户：非超级角色 huicai_app 已建好并接管对象属主，
      # 但 TenantRlsInitializer 实测从未让 app.enterprise_id 生效 ⇒ 切过去租户表全读 0 行。
      # 修复后把默认值改成 huicai_app（见 M5b 手册 §V3）。
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-huicai}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-huicai123}
      SPRING_RABBITMQ_HOST: host.docker.internal
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: huicai
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-huicai123}
      SPRING_DATA_REDIS_HOST: redis7
      SPRING_DATA_REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: huicai
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-huicai123}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env - see .env.example}
      # 敏感凭据从宿主环境注入，勿写入本文件（AGENTS §7-3）
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres16:
        condition: service_healthy
      redis7:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - huicai-net
    restart: unless-stopped