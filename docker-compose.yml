version: "3.8"

networks:
  huicai-net:
    driver: bridge

volumes:
  pgdata:
  minio-data:

services:
  postgres16:
    image: pgvector/pgvector:pg16
    container_name: huicai-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: huicai
      POSTGRES_PASSWORD: huicai123
      POSTGRES_DB: huicai
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    networks:
      - huicai-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huicai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis7:
    image: redis:7-alpine
    container_name: huicai-redis
    ports:
      - "6379:6379"
    networks:
      - huicai-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    container_name: huicai-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: huicai
      MINIO_ROOT_PASSWORD: huicai123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - huicai-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  rabbitmq3:
    image: rabbitmq:3-management
    container_name: huicai-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: huicai
      RABBITMQ_DEFAULT_PASS: huicai123
    networks:
      - huicai-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: huicai-ai-service
    ports:
      - "8000:8000"
    environment:
      HUICAI_RABBITMQ_URL: amqp://huicai:huicai123@rabbitmq3:5672/
      HUICAI_DB_HOST: postgres16
      HUICAI_DB_PORT: 5432
      HUICAI_DB_USER: huicai
      HUICAI_DB_PASSWORD: huicai123
      HUICAI_DB_NAME: huicai
      HUICAI_MINIO_ENDPOINT: http://minio:9000
      HUICAI_MINIO_ACCESS_KEY: huicai
      HUICAI_MINIO_SECRET_KEY: huicai123
      HUICAI_OCR_ENGINE: tesseract
    depends_on:
      rabbitmq3:
        condition: service_healthy
      postgres16:
        condition: service_healthy
    networks:
      - huicai-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: huicai-backend
    ports:
      - "8000:8000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres16:5432/huicai
      SPRING_DATASOURCE_USERNAME: huicai
      SPRING_DATASOURCE_PASSWORD: huicai123
      SPRING_RABBITMQ_HOST: rabbitmq3
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: huicai
      SPRING_RABBITMQ_PASSWORD: huicai123
      SPRING_DATA_REDIS_HOST: redis7
      SPRING_DATA_REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: huicai
      MINIO_SECRET_KEY: huicai123
    depends_on:
      postgres16:
        condition: service_healthy
      redis7:
        condition: service_healthy
      rabbitmq3:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - huicai-net
    restart: unless-stopped